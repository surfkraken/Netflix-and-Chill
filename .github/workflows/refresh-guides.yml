name: Refresh Netflix guides
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - refresh_netflix_guides.py
      - .github/workflows/refresh-guides.yml
permissions:
  contents: write
concurrency:
  group: netflix-guides-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 refresh_netflix_guides.py
      - name: Save guide index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netflix-guides.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Netflix monthly guides"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
